name: sabi
description: SABI - Pangan terjaga, bumi bahagia
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  http: ^1.2.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  supabase_flutter: ^2.18.3
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"  # <--- PASTIKAN INI ADA

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/recipes/
    - assets/model/

# --- KONFIGURASI LOGO (TARUH PALING BAWAH) ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true